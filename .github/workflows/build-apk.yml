name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [keymapper-v2-build, keymapper-v4-optimizer, keymapper-v5-hibernator]
permissions:
  contents: read
jobs:
  debug-apk:
    name: APK debug (Android 10+)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Usar Android SDK do runner
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Android API 35 e Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verificar arquivo APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: KeyMapper-Pro-V5-hibernator-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
