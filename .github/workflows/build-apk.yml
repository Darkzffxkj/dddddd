name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [keymapper-v2-build, keymapper-v4-optimizer, keymapper-v5-hibernator, referencia-v6-ui, referencia-v7-hud, referencia-v8-overlay-cursor, referencia-v9-game-controls, referencia-v10-overlay-settings, referencia-v11-overlay-session]
permissions:
  contents: write
jobs:
  debug-apk:
    name: APK debug (Android 10+)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Usar Android SDK do runner
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Android API 35 e Build Tools
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verificar arquivo APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Referencia-V11-Overlay-Fix-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar link direto do APK na aba Releases
        if: github.ref == 'refs/heads/referencia-v11-overlay-session'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -e
          TAG="referencia-v11"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#Referencia-V11.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK#Referencia-V11.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Referência V11 — correção do botão flutuante" \
              --notes "Android 10+. APK de teste; botão flutuante com correção de ciclo de vida e opção Diagnóstico HUD." \
              --prerelease
          fi
